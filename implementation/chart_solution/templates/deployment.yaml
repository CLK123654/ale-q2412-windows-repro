apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "callback-keyring.fullname" . }}
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: callback-keyring
  template:
    metadata:
      labels:
        app.kubernetes.io/name: callback-keyring
      annotations:
        keyring.example.com/phase: {{ .Values.phase | quote }}
        keyring.example.com/active-key: {{ .Values.activeKey | quote }}
        keyring.example.com/rotation-revision: {{ .Values.rotationRevision | quote }}
    spec:
      containers:
        - name: verifier
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          env:
            - name: ACTIVE_KEY
              valueFrom:
                configMapKeyRef:
                  name: {{ include "callback-keyring.fullname" . }}
                  key: activeKey
            - name: ACCEPTED_KEYS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "callback-keyring.fullname" . }}
                  key: acceptedKeys
          volumeMounts:
            - name: keyring
              mountPath: /var/run/keyring
              readOnly: true
      volumes:
        - name: keyring
          projected:
            sources:
{{- range $id := .Values.acceptedKeys }}
              - secret:
                  name: {{ (index $.Values.secretRefs $id).name }}
                  items:
                    - key: {{ (index $.Values.secretRefs $id).key }}
                      path: {{ printf "%s.key" $id | quote }}
{{- end }}
