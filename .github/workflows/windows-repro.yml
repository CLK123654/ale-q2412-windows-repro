name: q2412-windows-repro
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Workflow mode
        required: true
        default: reference
        type: choice
        options: [reference, verify]
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.12
      - uses: azure/setup-helm@v4
        with:
          version: v3.18.4
      - name: Install locked parser dependency
        shell: pwsh
        run: python -m pip install PyYAML==6.0.2
      - name: Record Windows host
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path evidence | Out-Null
          $hostInfo = [ordered]@{caption=(Get-CimInstance Win32_OperatingSystem).Caption;version=(Get-CimInstance Win32_OperatingSystem).Version;build=(Get-CimInstance Win32_OperatingSystem).BuildNumber;runner_image=$env:ImageOS;commit_sha=$env:GITHUB_SHA;workflow_run_id=$env:GITHUB_RUN_ID}
          $hostInfo | ConvertTo-Json | Set-Content -Encoding utf8NoBOM evidence/windows-host.json
      - name: Generate Reference candidate
        if: ${{ inputs.mode == 'reference' }}
        shell: pwsh
        run: |
          $env:HELM_PATH=(Get-Command helm).Source
          python ./qa/generate_reference.py
      - name: Verify attachment hashes
        if: ${{ inputs.mode == 'verify' }}
        shell: pwsh
        run: python ./qa/verify_hashes.py
      - name: Block task programs from external network
        if: ${{ inputs.mode == 'verify' }}
        shell: pwsh
        run: |
          foreach($program in @((Get-Command helm).Source,(Get-Command python).Source)){New-NetFirewallRule -DisplayName "q2412-$([Guid]::NewGuid())" -Direction Outbound -Program $program -Action Block | Out-Null}
          Get-NetFirewallRule -DisplayName q2412-* | Select-Object DisplayName,Enabled,Direction,Action | ConvertTo-Json | Set-Content -Encoding utf8NoBOM evidence/network-guard.json
      - name: Verify final task on Windows
        if: ${{ inputs.mode == 'verify' }}
        shell: pwsh
        run: |
          $env:HELM_PATH=(Get-Command helm).Source
          python ./qa/windows_verify.py
      - name: Remove network guard
        if: always()
        shell: pwsh
        run: Get-NetFirewallRule -DisplayName q2412-* -ErrorAction SilentlyContinue | Remove-NetFirewallRule
      - name: Upload independent evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q2412-windows-evidence
          path: evidence/**
          if-no-files-found: error
          retention-days: 1
